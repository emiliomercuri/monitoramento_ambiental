<svg viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <style>
    text{fill:#15232A}
    .t-title{font-weight:700;font-size:16px}
    .t-sub{font-size:12px;fill:#566A72}
    .t-pin{font-family:Consolas,'Courier New',monospace;font-size:12px}
    .t-pin-b{font-family:Consolas,'Courier New',monospace;font-size:12px;fill:#FFFFFF}
    .t-pin-off{font-family:Consolas,'Courier New',monospace;font-size:12px;fill:#FFFFFF;opacity:.55}
    .t-note{font-size:12px;fill:#566A72}
    .t-wire{font-size:12px;font-weight:700}
    .mod{fill:#EAF0F1;stroke:#9FB2B7;stroke-width:1.5}
    .board{fill:#1F5FA8}
    .chip{fill:none;stroke:#FFFFFF;stroke-opacity:.45;stroke-width:1.2}
    .pin{fill:#C9D6DA;stroke:#1F5FA8;stroke-width:1.5}
    .pin-on{fill:#FFD34D;stroke:#1F5FA8;stroke-width:1.5}
    .mpin{fill:#FFFFFF;stroke:#9FB2B7;stroke-width:1.5}
    .w{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    .w-a{stroke:#2F6FDB} .w-cs{stroke:#E07A1F} .w-sck{stroke:#2E9E4F} .w-miso{stroke:#8A4FD0}
    .w-mosi{stroke:#C23B7A} .w-sda{stroke:#1795B0} .w-scl{stroke:#B0692A} .w-dq{stroke:#D6A800}
    .w-v{stroke:#D0342C} .w-g{stroke:#262B2E} .w-probe{stroke:#9FB2B7;stroke-width:5}
    .p33{fill:#D0342C} .t-p33{fill:#FFFFFF;font-family:Consolas,'Courier New',monospace;font-size:11px;font-weight:700}
    .pg{fill:#262B2E} .t-pg{fill:#FFFFFF;font-family:Consolas,'Courier New',monospace;font-size:11px;font-weight:700}
    .res{fill:none;stroke:#15232A;stroke-width:2;stroke-linejoin:round}
  </style>
  <rect x="0" y="0" width="1080" height="720" fill="#FFFFFF"/>

  <!-- ============ WEMOS D1 MINI ============ -->
  <rect x="440" y="110" width="220" height="365" rx="10" class="board"/>
  <rect x="478" y="124" width="144" height="92" rx="4" class="chip"/>
  <text x="550" y="162" text-anchor="middle" class="t-pin-b">ESP8266</text>
  <text x="550" y="300" text-anchor="middle" style="fill:#FFFFFF;font-weight:700;font-size:22px">WEMOS</text>
  <text x="550" y="322" text-anchor="middle" style="fill:#FFFFFF;font-weight:700;font-size:16px">D1 mini</text>
  <rect x="522" y="462" width="56" height="22" rx="3" fill="#B9C3C7" stroke="#7D8A8F"/>
  <text x="550" y="500" text-anchor="middle" class="t-note">USB (programar)</text>

  <circle cx="440" cy="150" r="5.5" class="pin"/><text x="454" y="154" class="t-pin-off">RST</text>
  <circle cx="440" cy="190" r="5.5" class="pin-on"/><text x="454" y="194" class="t-pin-b">A0</text>
  <circle cx="440" cy="230" r="5.5" class="pin-on"/><text x="454" y="234" class="t-pin-b">D0</text>
  <circle cx="440" cy="270" r="5.5" class="pin-on"/><text x="454" y="274" class="t-pin-b">D5</text>
  <circle cx="440" cy="310" r="5.5" class="pin-on"/><text x="454" y="314" class="t-pin-b">D6</text>
  <circle cx="440" cy="350" r="5.5" class="pin-on"/><text x="454" y="354" class="t-pin-b">D7</text>
  <circle cx="440" cy="390" r="5.5" class="pin"/><text x="454" y="394" class="t-pin-off">D8</text>
  <circle cx="440" cy="430" r="5.5" class="pin-on"/><text x="454" y="434" class="t-pin-b">3V3</text>
  <circle cx="660" cy="150" r="5.5" class="pin"/><text x="646" y="154" text-anchor="end" class="t-pin-off">TX</text>
  <circle cx="660" cy="190" r="5.5" class="pin"/><text x="646" y="194" text-anchor="end" class="t-pin-off">RX</text>
  <circle cx="660" cy="230" r="5.5" class="pin-on"/><text x="646" y="234" text-anchor="end" class="t-pin-b">D1</text>
  <circle cx="660" cy="270" r="5.5" class="pin-on"/><text x="646" y="274" text-anchor="end" class="t-pin-b">D2</text>
  <circle cx="660" cy="310" r="5.5" class="pin"/><text x="646" y="314" text-anchor="end" class="t-pin-off">D3</text>
  <circle cx="660" cy="350" r="5.5" class="pin-on"/><text x="646" y="354" text-anchor="end" class="t-pin-b">D4</text>
  <circle cx="660" cy="390" r="5.5" class="pin-on"/><text x="646" y="394" text-anchor="end" class="t-pin-b">G</text>
  <circle cx="660" cy="430" r="5.5" class="pin-on"/><text x="646" y="434" text-anchor="end" class="t-pin-b">5V</text>

  <path d="M434 430 H424" class="w w-v"/>
  <rect x="382" y="421" width="42" height="18" rx="3" class="p33"/><text x="403" y="434" text-anchor="middle" class="t-p33">3V3</text>

  <!-- ============ SENSOR TDS ============ -->
  <rect x="110" y="150" width="170" height="85" rx="6" class="mod"/>
  <text x="124" y="176" class="t-title">Sensor TDS</text>
  <text x="124" y="194" class="t-sub">TDS Meter V1.0</text>
  <circle cx="280" cy="190" r="5" class="mpin"/><text x="270" y="194" text-anchor="end" class="t-pin">A</text>
  <circle cx="160" cy="235" r="5" class="mpin"/><text x="160" y="224" text-anchor="middle" class="t-pin">+</text>
  <circle cx="220" cy="235" r="5" class="mpin"/><text x="220" y="224" text-anchor="middle" class="t-pin">−</text>
  <path d="M160 240 V256" class="w w-v"/>
  <rect x="139" y="256" width="42" height="18" rx="3" class="p33"/><text x="160" y="269" text-anchor="middle" class="t-p33">3V3</text>
  <path d="M220 240 V256" class="w w-g"/>
  <rect x="199" y="256" width="42" height="18" rx="3" class="pg"/><text x="220" y="269" text-anchor="middle" class="t-pg">GND</text>
  <path d="M110 180 H72 V214" class="w w-probe"/>
  <rect x="60" y="214" width="24" height="54" rx="5" fill="#F4F6F6" stroke="#9FB2B7"/>
  <path d="M67 268 V288 M77 268 V288" stroke="#8C979B" stroke-width="3" stroke-linecap="round"/>
  <text x="72" y="306" text-anchor="middle" class="t-note">sonda</text>
  <text x="72" y="321" text-anchor="middle" class="t-note">(na água)</text>
  <path d="M285 190 H435" class="w w-a"/>
  <text x="362" y="181" text-anchor="middle" class="t-wire" style="fill:#2F6FDB">sinal 0–2,3 V</text>

  <!-- ============ MÓDULO microSD ============ -->
  <rect x="110" y="300" width="170" height="180" rx="6" class="mod"/>
  <text x="124" y="326" class="t-title">Módulo</text>
  <text x="124" y="344" class="t-title">microSD</text>
  <rect x="124" y="360" width="64" height="72" rx="3" fill="none" stroke="#9FB2B7" stroke-dasharray="4 3"/>
  <text x="156" y="400" text-anchor="middle" class="t-note">cartão</text>
  <circle cx="280" cy="320" r="5" class="mpin"/><text x="270" y="324" text-anchor="end" class="t-pin">SCK</text>
  <circle cx="280" cy="350" r="5" class="mpin"/><text x="270" y="354" text-anchor="end" class="t-pin">MISO</text>
  <circle cx="280" cy="380" r="5" class="mpin"/><text x="270" y="384" text-anchor="end" class="t-pin">MOSI</text>
  <circle cx="280" cy="410" r="5" class="mpin"/><text x="270" y="414" text-anchor="end" class="t-pin">CS</text>
  <circle cx="160" cy="480" r="5" class="mpin"/><text x="160" y="469" text-anchor="middle" class="t-pin">VCC</text>
  <circle cx="220" cy="480" r="5" class="mpin"/><text x="220" y="469" text-anchor="middle" class="t-pin">GND</text>
  <path d="M160 485 V501" class="w w-v"/>
  <rect x="139" y="501" width="42" height="18" rx="3" class="p33"/><text x="160" y="514" text-anchor="middle" class="t-p33">3V3</text>
  <path d="M220 485 V501" class="w w-g"/>
  <rect x="199" y="501" width="42" height="18" rx="3" class="pg"/><text x="220" y="514" text-anchor="middle" class="t-pg">GND</text>
  <path d="M285 320 H320 V270 H435" class="w w-sck"/>
  <path d="M285 350 H345 V310 H435" class="w w-miso"/>
  <path d="M285 380 H370 V350 H435" class="w w-mosi"/>
  <path d="M285 410 H410 V230 H435" class="w w-cs"/>

  <!-- ============ RTC DS3231 ============ -->
  <rect x="820" y="200" width="190" height="95" rx="6" class="mod"/>
  <text x="998" y="232" text-anchor="end" class="t-title">RTC</text>
  <text x="998" y="250" text-anchor="end" class="t-sub">DS3231</text>
  <circle cx="820" cy="230" r="5" class="mpin"/><text x="832" y="234" class="t-pin">C (SCL)</text>
  <circle cx="820" cy="270" r="5" class="mpin"/><text x="832" y="274" class="t-pin">D (SDA)</text>
  <circle cx="870" cy="295" r="5" class="mpin"/><text x="870" y="287" text-anchor="middle" class="t-pin">+</text>
  <circle cx="930" cy="295" r="5" class="mpin"/><text x="930" y="287" text-anchor="middle" class="t-pin">−</text>
  <circle cx="980" cy="295" r="5" class="mpin"/><text x="980" y="287" text-anchor="middle" class="t-pin" style="fill:#566A72">NC</text>
  <path d="M870 300 V314" class="w w-v"/>
  <rect x="849" y="314" width="42" height="18" rx="3" class="p33"/><text x="870" y="327" text-anchor="middle" class="t-p33">3V3</text>
  <path d="M930 300 V314" class="w w-g"/>
  <rect x="909" y="314" width="42" height="18" rx="3" class="pg"/><text x="930" y="327" text-anchor="middle" class="t-pg">GND</text>
  <path d="M665 230 H815" class="w w-scl"/>
  <path d="M665 270 H815" class="w w-sda"/>

  <!-- ============ DS18B20 ============ -->
  <rect x="860" y="338" width="150" height="88" rx="6" class="mod"/>
  <text x="998" y="388" text-anchor="end" class="t-title">DS18B20</text>
  <text x="998" y="406" text-anchor="end" class="t-sub">à prova d'água</text>
  <circle cx="860" cy="350" r="5" class="mpin"/><text x="872" y="354" class="t-pin">dados</text>
  <circle cx="860" cy="380" r="5" class="mpin"/><text x="872" y="384" class="t-pin">VCC</text>
  <circle cx="860" cy="410" r="5" class="mpin"/><text x="872" y="414" class="t-pin">GND</text>
  <rect x="1012" y="373" width="56" height="16" rx="8" fill="#B9C3C7" stroke="#7D8A8F"/>
  <text x="1040" y="408" text-anchor="middle" class="t-note">ponta</text>
  <path d="M665 350 H855" class="w w-dq"/>
  <text x="702" y="341" text-anchor="middle" class="t-wire" style="fill:#B38C00">amarelo</text>
  <path d="M855 380 H840" class="w w-v"/>
  <rect x="798" y="371" width="42" height="18" rx="3" class="p33"/><text x="819" y="384" text-anchor="middle" class="t-p33">3V3</text>
  <path d="M855 410 H840" class="w w-g"/>
  <rect x="798" y="401" width="42" height="18" rx="3" class="pg"/><text x="819" y="414" text-anchor="middle" class="t-pg">GND</text>
  <circle cx="770" cy="350" r="4.5" fill="#15232A"/>
  <path d="M770 350 V342 L763 339 L777 333 L763 327 L777 321 L763 315 L770 312 V306" class="res"/>
  <rect x="749" y="288" width="42" height="18" rx="3" class="p33"/><text x="770" y="301" text-anchor="middle" class="t-p33">3V3</text>
  <text x="784" y="330" class="t-wire">4,7 kΩ</text>

  <!-- ============ ENERGIA ============ -->
  <path d="M665 430 H700 V486" class="w w-v"/>
  <circle cx="700" cy="490" r="4" fill="none" stroke="#D0342C" stroke-width="2.5"/>
  <path d="M700 494 L718 524" class="w w-v"/>
  <circle cx="700" cy="528" r="4" fill="none" stroke="#D0342C" stroke-width="2.5"/>
  <path d="M700 532 V575" class="w w-v"/>
  <text x="688" y="506" text-anchor="end" class="t-wire">chave</text>
  <text x="688" y="521" text-anchor="end" class="t-note">liga/desliga</text>
  <text x="708" y="458" class="t-wire" style="fill:#D0342C">5V</text>
  <path d="M665 390 H740 V575" class="w w-g"/>
  <text x="748" y="470" class="t-wire">GND</text>

  <rect x="640" y="580" width="160" height="80" rx="6" class="mod"/>
  <circle cx="700" cy="580" r="5" class="mpin"/><text x="700" y="600" text-anchor="middle" class="t-pin">OUT+</text>
  <circle cx="740" cy="580" r="5" class="mpin"/><text x="752" y="600" text-anchor="middle" class="t-pin">OUT−</text>
  <circle cx="640" cy="608" r="5" class="mpin"/><text x="650" y="612" class="t-pin">B+</text>
  <circle cx="640" cy="640" r="5" class="mpin"/><text x="650" y="644" class="t-pin">B−</text>
  <text x="730" y="628" text-anchor="middle" class="t-title" style="font-size:15px">TP4056</text>
  <text x="730" y="645" text-anchor="middle" class="t-sub">carregador</text>
  <rect x="708" y="656" width="44" height="12" rx="3" fill="#B9C3C7" stroke="#7D8A8F"/>
  <text x="730" y="686" text-anchor="middle" class="t-note">USB-C: carregar aqui</text>

  <rect x="552" y="569" width="20" height="7" rx="2" fill="#9FB2B7"/>
  <rect x="540" y="575" width="44" height="100" rx="8" fill="#3FA35B"/>
  <text x="562" y="625" text-anchor="middle" transform="rotate(-90 562 625)" style="fill:#FFFFFF;font-weight:700;font-size:14px">18650</text>
  <text x="530" y="620" text-anchor="end" class="t-wire">Bateria</text>
  <text x="530" y="636" text-anchor="end" class="t-note">3,7 V · 3450 mAh</text>
  <text x="547" y="563" text-anchor="end" class="t-wire" style="fill:#D0342C">+</text>
  <text x="547" y="694" text-anchor="end" class="t-wire">−</text>
  <path d="M562 569 V555 H610 V608 H635" class="w w-v"/>
  <path d="M562 675 V695 H620 V640 H635" class="w w-g"/>

  <!-- legenda -->
  <rect x="40" y="590" width="42" height="18" rx="3" class="p33"/><text x="61" y="603" text-anchor="middle" class="t-p33">3V3</text>
  <text x="92" y="603" class="t-note">ligar no pino 3V3 do Wemos (trilha + da protoboard)</text>
  <rect x="40" y="620" width="42" height="18" rx="3" class="pg"/><text x="61" y="633" text-anchor="middle" class="t-pg">GND</text>
  <text x="92" y="633" class="t-note">ligar no pino G do Wemos (trilha − da protoboard)</text>
  <circle cx="61" cy="660" r="5.5" class="pin-on"/>
  <text x="92" y="664" class="t-note">pino do Wemos em uso</text>
</svg>
