; PlatformIO - Wemos D1 mini (ESP8266)
; Firmware: src/main.cpp (TDS + DS18B20 + MQTT)

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

; Porta serial / monitor
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; Bibliotecas usadas em main.cpp
lib_deps =
    knolleary/PubSubClient @ ^2.8
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

; Gravacao via USB (ajuste a porta apenas se necessario)
upload_speed = 115200
